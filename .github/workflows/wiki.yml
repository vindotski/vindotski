# Mirrors docs/ to the GitHub wiki (docs/decisions/0001-adrs-and-wiki.md).
# The wiki has to be enabled, with one page created, before the first run.
name: Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/sync-wiki.mjs"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  sync:
    # The wiki mirrors what's released: main only, also when run by hand (ADRs 0001, 0018).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Plain git instead of actions/checkout: no third-party action to pin. The
      # token goes through a credential helper, so it's never written into a URL
      # or a .git/config.
      - name: Check out the repository and its wiki
        run: |
          auth=(-c credential.helper= -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$TOKEN"; }; f')
          git init -q repo
          git "${auth[@]}" -C repo fetch -q --depth 1 "https://github.com/${REPO}.git" "${SHA}"
          git -C repo checkout -q FETCH_HEAD
          git "${auth[@]}" clone -q --depth 1 "https://github.com/${REPO}.wiki.git" wiki

      - name: Write the wiki pages
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: node repo/scripts/sync-wiki.mjs repo/docs wiki "${REPO_URL}" main

      - name: Push them
        run: |
          cd wiki
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Sync from docs/ at ${SHA}"
          git -c credential.helper= -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$TOKEN"; }; f' push -q
